<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link href="css/style.css" rel="stylesheet">
	<link rel="icon" type="image/png" href="img/Satelite.png">
    <title>Menu</title>
</head>
<body class="body_menu">
    <header class="header_menu">
        <div class="logo">
            <img src="img/logo_letra_branca.png">
        </div>
        <nav class="navbar_menu">
            <a href="index.html" target="conteudo">Início</a>
            <a href="emergencia.html" target="conteudo">Emergência</a>
            <a href="monitoramento.html" target="conteudo">Monitoramento</a>
            <a href="sobre.html" target="conteudo">Sobre</a>
            <a href="contato.html" target="conteudo">Contato</a>
        </nav>
        <button id="menuButton" class="btn-menu"></button>
    </header>
    <script>
        window.addEventListener("message", function (event) {
            const btn = document.getElementById("menuButton");

            // Remove classes antigas
            btn.classList.remove("btn-blue", "btn-red", "btn-menu");

            // Aplica a nova cor enviada pela página
            if (event.data.color === "blue") {
                btn.classList.add("btn-blue");
                btn.innerHTML = '<a href="emergencia.html" target="conteudo">&#128225;&nbsp; Solicitar Ajuda</a>';
            }

            if (event.data.color === "red") {
                btn.classList.add("btn-red");
                btn.innerHTML = '<a href="monitoramento.html" target="conteudo">&#9888; &nbsp; Acompanhar Emergência';
            }

            if (event.data.color === "transparent") {
                btn.classList.add("btn-transparent");
                btn.innerHTML = '<div class="user-box row"><div class="avatar-status col-md-1"><i class="bi bi-person-circle"></i></div><div class="text-status col-md-1"><span class="user-name mb-0">Central SATHELP</span><br><span class="user-function mb-0">Operador</span></div></div>';
            }
        });
    </script>
</body>
</html>
