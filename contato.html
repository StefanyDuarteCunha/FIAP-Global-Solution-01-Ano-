<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link href="css/style.css" rel="stylesheet">
	<link rel="icon" type="image/png" href="img/Satelite.png">
	<title>Contato</title>
</head>
<body>
	<header>
		<iframe src="menu.html" style="width:100%; height:70px; border:none;"></iframe>
	</header>
	<div class="conteudo conteudo_contato">
		<div class="line_title_contato row">
			<div class="box_title_contato col-md-1">
				<i class="bi bi-chat-dots icon_contato"></i>
			</div>
			<div class="box_title_contato col-md-3">
				<h1 class="title_contato mb-0">FALE CONOSCO</h1>
				<p class="p_title_contato mb-0">Deixe sua mensagem &nbsp; &#x25CF; &nbsp; Retorno em até 02 dias úteis</p>
			</div>
		</div>
		<div class="container_contato">
			<form id="formulario_JS" class="forms_contato">
				<div class="row g-4">
					<div class="col-md-6">
						<label for="validationDefault01" class="form-label titulo_label_contato">Nome Completo</label>
						<input type="text" class="form-control" id="nomecompleto" required pattern="^[A-Za-zÀ-ÿ]+(?:\s+[A-Za-zÀ-ÿ]+)+$" title="Digite o nome e sobrenome" placeholder="Digite o seu nome">
					</div>
					<div class="col-md-6">
						<label for="exampleFormControlInput1" class="form-label titulo_label_contato">E-mail</label>
						<input type="email" class="form-control" id="email" placeholder="name@example.com" required
							pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Digite o email no formato nome@example.com">
					</div>
				</div>
				<div class="my_forms_contato row g-4">
					<div class="col-md-6">
						<label for="Telefone" class="form-label titulo_label_contato">Número de Celular</label>
						<input type="tel" class="form-control" id="telefone" placeholder="(99) 99999-9999"
							maxlength="15" required pattern="^\(\d{2}\)\s\d{4,5}-\d{4}$" title="Digite o ddd e o número de telefone completo">
						<script>
							/* Responsável por validar o conteúdo preenchido */
							document.getElementById('telefone').addEventListener('input', function (e) {
								let value = e.target.value.replace(/\D/g, '');
								value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
								value = value.replace(/(\d{5})(\d)/, '$1-$2');
								e.target.value = value;
							});
						</script>
					</div>
					<div class="col-md-6">
						<p class="titulo_label_contato">Telefone é o mesmo para Whatsapp e ligação?</p>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Telefone" id="inlineRadio1" value="Sim"
								required>
							<label class="form-check-label" for="inlineRadio1">Sim</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Telefone" id="inlineRadio2" value="Não"
								required>
							<label class="form-check-label" for="inlineRadio2">Não</label>
						</div>
					</div>
				</div>
				<div class="my_forms_contato row g-4">
					<div class="col-md-12">
						<p class="titulo_label_contato">Qual o assunto da mensagem?</p>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio1"
								value="Reclamação" required>
							<label class="form-check-label" for="inlineRadio1">Reclamação</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio2" value="Dúvida"
								required>
							<label class="form-check-label" for="inlineRadio2">Dúvida</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio3"
								value="Sugestão" required>
							<label class="form-check-label" for="inlineRadio3">Sugestão</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio4" value="Dica"
								required>
							<label class="form-check-label" for="inlineRadio4">Dica</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio4" value="Elogio"
								required>
							<label class="form-check-label" for="inlineRadio4">Elogio</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio4"
								value="Denúncia" required>
							<label class="form-check-label" for="inlineRadio4">Denúncia</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" name="Assunto" id="inlineRadio4" value="Outros"
								required>
							<label class="form-check-label" for="inlineRadio4">Outros</label>
						</div>
					</div>
				</div>
				<div class="my_forms_contato row g-4">
					<div class="col-md-12">
						<label for="textMensagem" class="form-label titulo_label_contato">Mensagem</label>
						<textarea class="form-control" id="textMensagem" rows="3" maxlength="500" required></textarea>
						<p class="cont_caracteres"><span id="contadorCaracteres">0</span>/500 caracteres</p>
					</div>
					<script>
						/* Responsável por contar os caracteres da mensagem */
						const campoMensagem = document.getElementById("textMensagem");
						const contador = document.getElementById("contadorCaracteres");
						campoMensagem.addEventListener("input", () => {
							contador.textContent = campoMensagem.value.length;
						});
					</script>
				</div>
				<div class="row g-4">
					<div class="container_botao_contato col-md-12">
						<button type="submit" id="submit_botao" class="botao_enviar">Enviar</button>
					</div>
				</div>
			</form>
		</div>
		<script>
			/* Responsável por emitir uma mensagem ao enviar o formulário */
			document.getElementById("formulario_JS").addEventListener("submit", function (e) {
				e.preventDefault();
				alert("Mensagem encaminhada com sucesso! Entraremos em contato em até 07 dias úteis.");
				this.reset();
			});
		</script>
	</div>
	<footer>
		<p class="p_footer">&#x00A9; &nbsp; 2026 - SATHELP &#x25CF; Conectando vidas quando mais importa &#128225;</p>
	</footer>
</body>
</html>
